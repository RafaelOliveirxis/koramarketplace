<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff3b1f"><title>FlashMarket | Status do pagamento</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/commerce-flow.css"><link rel="stylesheet" href="css/flow-unified.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container flow-main"><section class="payment-status" style="max-width:680px;margin:70px auto"><div class="status-card flow-card" style="text-align:center;padding:42px"><div class="status-icon" id="icon">…</div><h1 id="title">Consultando pagamento</h1><p id="message">Estamos confirmando o status do seu pedido.</p><span class="status-order" id="orderNumber">Pedido</span><div class="status-detail" id="detail"></div><div class="status-actions"><a class="primary" href="minha-conta.html">MINHAS COMPRAS</a><a class="secondary" href="index.html">VOLTAR À LOJA</a></div></div></section></main><script src="js/interno.js?v=20261001-1"></script><script>(async()=>{const API_BASE=window.FLASHMARKET_API_BASE||(location.hostname.endsWith('github.io')?'https://koramarketplace.vercel.app':'');const q=new URLSearchParams(location.search),id=q.get('order');const icon=document.getElementById('icon'),title=document.getElementById('title'),message=document.getElementById('message'),num=document.getElementById('orderNumber'),detail=document.getElementById('detail');if(!id){icon.textContent='!';title.textContent='Pedido não informado';message.textContent='Não foi possível identificar o pedido.';return}num.textContent='Pedido '+id;async function check(){try{const r=await fetch(API_BASE+'/api/payments/status?order='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro');const status=String(d.order.status||'').toLowerCase();detail.textContent='Status: '+(d.order.statusDetail||status);if(status==='paid'||status==='processed'||status==='approved'){icon.textContent='✓';title.textContent='Pagamento aprovado!';message.textContent='Seu pagamento foi confirmado. O pedido está registrado no FlashMarket.';return true}if(status==='cancelled'||status==='canceled'){icon.textContent='×';title.textContent='Pagamento não concluído';message.textContent='O pagamento não foi concluído. Você pode voltar à loja e tentar novamente.';return true}icon.textContent='…';title.textContent='Pagamento pendente';message.textContent='O pagamento ainda está sendo processado. Esta página será atualizada automaticamente.';return false}catch(e){icon.textContent='!';title.textContent='Não foi possível consultar agora';message.textContent=e.message||'Tente novamente em instantes.';return false}}let done=await check();if(!done){let tries=0;const timer=setInterval(async()=>{if(++tries>=12){clearInterval(timer);return}if(await check())clearInterval(timer)},5000)}})();</script></body></html>
