<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMarket | Status do pagamento</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/commerce-flow.css"><style>body{background:#f5f6f8}.payment-status{max-width:680px;margin:70px auto}.status-icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#fff0eb;color:#ff4327;font-size:34px;font-weight:900}.status-card{text-align:center;padding:42px;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(20,25,35,.08)}.status-card h1{font-size:30px;margin-bottom:8px}.status-card p{color:#777;font-size:13px}.status-order{display:inline-block;margin:18px 0;padding:9px 14px;background:#f5f5f5;border-radius:999px;font-size:12px;font-weight:800}.status-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}.status-actions a{padding:12px 18px;border-radius:10px;font-size:11px;font-weight:900}.primary{background:#ff4327;color:#fff}.secondary{background:#f1f2f4;color:#222}.status-detail{margin-top:18px;font-size:11px;color:#999}</style></head><body class="fm-page"><div data-fm-header></div><main class="fm-container"><section class="payment-status"><div class="status-card"><div class="status-icon" id="icon">…</div><h1 id="title">Consultando pagamento</h1><p id="message">Estamos confirmando o status do seu pedido.</p><span class="status-order" id="orderNumber">Pedido</span><div class="status-detail" id="detail"></div><div class="status-actions"><a class="primary" href="minha-conta.html">MINHAS COMPRAS</a><a class="secondary" href="index.html">VOLTAR À LOJA</a></div></div></section></main><script src="js/interno.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),id=q.get('order');const icon=document.getElementById('icon'),title=document.getElementById('title'),message=document.getElementById('message'),num=document.getElementById('orderNumber'),detail=document.getElementById('detail');if(!id){icon.textContent='!';title.textContent='Pedido não informado';message.textContent='Não foi possível identificar o pedido.';return}num.textContent='Pedido '+id;async function check(){try{const r=await fetch('/api/payments/status?order='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro');const status=String(d.order.status||'').toLowerCase();detail.textContent='Status técnico: '+(d.order.statusDetail||status);if(status==='paid'||status==='processed'){icon.textContent='✓';title.textContent='Pagamento aprovado!';message.textContent='Seu pagamento foi confirmado. O pedido está registrado no FlashMarket.';return true}if(status==='cancelled'||status==='canceled'){icon.textContent='×';title.textContent='Pagamento não concluído';message.textContent='A order foi cancelada. Você pode voltar à loja e tentar novamente.';return true}icon.textContent='…';title.textContent='Pagamento pendente';message.textContent='O Mercado Pago ainda está processando seu pagamento. Esta página será atualizada automaticamente.';return false}catch(e){icon.textContent='!';title.textContent='Não foi possível consultar agora';message.textContent=e.message||'Tente novamente em instantes.';return false}}let done=await check();if(!done){let tries=0;const timer=setInterval(async()=>{if(++tries>=12){clearInterval(timer);return}if(await check())clearInterval(timer)},5000)}})();</script></body></html>
