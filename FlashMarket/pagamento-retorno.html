<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff3b1f"><title>FlashMarket | Status do pagamento</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/commerce-flow.css"><link rel="stylesheet" href="css/flow-unified.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container flow-main"><section class="payment-status" style="max-width:680px;margin:70px auto"><div class="status-card flow-card" style="text-align:center;padding:42px"><div class="status-icon" id="icon">…</div><h1 id="title">Consultando pagamento</h1><p id="message">Estamos confirmando o status do seu pedido.</p><span class="status-order" id="orderNumber">Pedido</span><div class="status-detail" id="detail"></div><div class="status-actions"><a class="primary" href="minha-conta.html">MINHAS COMPRAS</a><a class="secondary" href="index.html">VOLTAR À LOJA</a></div></div></section></main><script src="js/interno.js?v=20261003-7"></script><script>(async()=>{const API_BASE=window.FLASHMARKET_API_BASE||((location.protocol==='file:'||!location.hostname||location.hostname.endsWith('github.io')||location.hostname.endsWith('vercel.app'))?'https://koramarketplace-tcc21.vercel.app':'');const q=new URLSearchParams(location.search),id=q.get('order');const icon=document.getElementById('icon'),title=document.getElementById('title'),message=document.getElementById('message'),num=document.getElementById('orderNumber'),detail=document.getElementById('detail');if(!id){icon.textContent='!';title.textContent='Pedido não informado';message.textContent='Não foi possível identificar o pedido.';return}num.textContent='Pedido '+id;function finish(){localStorage.removeItem('flashmarket_pending_order')}async function check(){try{const r=await fetch(API_BASE+'/api/payments/status?order='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erro ao consultar o pagamento.');const status=String(d.order.paymentStatus||'pending').toLowerCase(),raw=String(d.order.statusDetail||d.order.status||'').replaceAll('_',' ');detail.textContent='Status: '+(raw||status);if(status==='paid'){icon.textContent='✓';title.textContent='Pagamento aprovado!';message.textContent='Seu pagamento foi confirmado pelo Mercado Pago. O pedido está registrado no FlashMarket.';finish();return true}if(status==='failed'||status==='cancelled'){icon.textContent='×';title.textContent=status==='failed'?'Pagamento recusado':'Pagamento cancelado';message.textContent='O pagamento não foi concluído. Você pode voltar à loja e tentar novamente.';finish();return true}if(status==='refunded'){icon.textContent='↩';title.textContent='Pagamento reembolsado';message.textContent='Este pagamento consta como reembolsado.';finish();return true}if(status==='action_required'){icon.textContent='!';title.textContent='Ação necessária no pagamento';message.textContent='O Mercado Pago solicitou uma ação para concluir o pagamento. Volte ao checkout para continuar.';return true}icon.textContent='…';title.textContent='Pagamento pendente';message.textContent='O pagamento ainda está sendo processado. Esta página será atualizada automaticamente.';return false}catch(e){icon.textContent='!';title.textContent='Não foi possível consultar agora';message.textContent=e.message||'Tente novamente em instantes.';return false}}let done=await check();if(!done){let tries=0;const timer=setInterval(async()=>{if(++tries>=24){clearInterval(timer);detail.textContent='Ainda aguardando confirmação. Você pode acompanhar o pedido em Minhas Compras.';return}if(await check())clearInterval(timer)},5000)}})();</script></body></html>
