<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Catálogo completo FlashMarket"><title>FlashMarket | Catálogo</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><style>.catalog-toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}.catalog-count{font-size:11px;color:#777;margin:14px 0}.fm-products{grid-template-columns:repeat(4,1fr)}@media(max-width:900px){.fm-products{grid-template-columns:repeat(3,1fr)}.catalog-toolbar{grid-template-columns:1fr 1fr}}@media(max-width:600px){.fm-products{grid-template-columns:repeat(2,1fr)}.catalog-toolbar{grid-template-columns:1fr}}</style></head><body class="fm-page"><div data-fm-header></div><main class="fm-container fm-section"><div class="fm-hero"><span class="fm-kicker">⚡ CATÁLOGO COMPLETO</span><h1 class="fm-title">Encontre seus favoritos</h1><p class="fm-subtitle">Mais de 50 produtos em eletrônicos, moda, casa, beleza, pet, esportes e papelaria.</p></div><div class="fm-card fm-card-pad" style="margin-bottom:12px"><div class="catalog-toolbar"><input id="search" class="fm-input" placeholder="🔎 Buscar produto..." autocomplete="off"><select id="cat" class="fm-input"><option value="all">Todas as categorias</option><option>Eletrônicos</option><option>Vestuário</option><option>Casa & Decor</option><option>Papelaria</option><option>Pet Shop</option><option>Beleza</option><option>Esportes</option></select><select id="sort" class="fm-input"><option value="relevance">Mais relevantes</option><option value="low">Menor preço</option><option value="high">Maior preço</option></select></div></div><div class="catalog-count" id="count"></div><div id="grid" class="fm-products"></div></main><footer class="fm-footer"><div class="fm-container fm-footer-grid"><div><h3>FlashMarket</h3><p>Produtos selecionados, ofertas e uma experiência simples de compra.</p></div><div><h3>Ajuda</h3><a href="suporte.html">Central de atendimento</a><br><a href="rastrear-pedido.html">Rastrear pedido</a></div><div><h3>Conta</h3><a href="minha-conta.html">Minha conta</a><br><a href="carrinho.html">Carrinho</a></div></div></footer><script src="js/interno.js"></script><script>const params=new URLSearchParams(location.search);const search=document.querySelector('#search'),cat=document.querySelector('#cat'),sort=document.querySelector('#sort');search.value=params.get('q')||'';if(params.get('c'))cat.value=params.get('c');function render(){const q=search.value.toLowerCase().trim();let a=FM_PRODUCTS.filter(p=>(cat.value==='all'||p.c===cat.value)&&(!q||p.n.toLowerCase().includes(q)||p.c.toLowerCase().includes(q)));if(sort.value==='low')a.sort((x,y)=>x.p-y.p);if(sort.value==='high')a.sort((x,y)=>y.p-x.p);document.querySelector('#count').textContent=a.length+' produto(s) encontrado(s)';document.querySelector('#grid').innerHTML=a.map(p=>'<article class="fm-product"><div class="fm-product-img"><img src="'+p.i+'" alt="'+p.n+'" loading="lazy"><span class="fm-badge">OFERTA</span></div><div class="fm-product-body"><span class="fm-product-cat">'+p.c+'</span><h3>'+p.n+'</h3><div class="fm-rating">★★★★★ <span style="color:#777">4,8</span></div><div class="fm-price">'+fmMoney(p.p)+' <span class="fm-old">'+fmMoney(p.o)+'</span></div><div class="fm-product-actions"><button class="fm-btn orange" onclick="fmAdd('+p.id+')">Adicionar</button><a class="fm-btn light" href="carrinho.html">🛒</a></div></div></article>').join('')||'<div class="fm-card fm-empty" style="grid-column:1/-1"><div class="icon">🔎</div><h2>Nenhum produto encontrado</h2><p>Tente outro termo ou categoria.</p></div>'}search.oninput=render;cat.onchange=render;sort.onchange=render;render();</script></body></html>
