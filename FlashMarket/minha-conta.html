<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Minha conta FlashMarket"><title>FlashMarket | Minha Conta</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container fm-section"><div class="fm-hero"><span class="fm-kicker">👤 ÁREA DO CLIENTE</span><h1 class="fm-title">Minha conta</h1><p class="fm-subtitle">Gerencie seus pedidos, dados pessoais e preferências em um só lugar.</p></div><div id="account"></div></main><footer class="fm-footer"><div class="fm-container fm-footer-grid"><div><h3>FlashMarket</h3><p>Uma experiência de compra simples, moderna e segura.</p></div><div><h3>Ajuda</h3><a href="suporte.html">Central de atendimento</a><br><a href="rastrear-pedido.html">Rastrear pedido</a></div><div><h3>Compras</h3><a href="produtos.html">Produtos</a><br><a href="carrinho.html">Carrinho</a></div></div></footer><script src="js/interno.js"></script><script>const user=localStorage.getItem('flashmarket_user');if(!user){location.href='login.html?return=minha-conta.html'}else{const profile=JSON.parse(localStorage.getItem('flashmarket_user_profile')||'{}');document.querySelector('#account').innerHTML='<div class="fm-grid" style="grid-template-columns:260px 1fr"><aside><div class="fm-card fm-card-pad" style="background:#111;color:#fff;text-align:center"><div style="width:70px;height:70px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:28px;margin:0 auto 12px;border:3px solid #ffb15a">👤</div><h2 style="font-size:17px">'+user+'</h2><p style="color:#aaa;font-size:10px;margin:6px 0 16px">'+(profile.email||'Cliente FlashMarket')+'</p><button class="fm-btn full" onclick="logout()">SAIR DA CONTA</button></div><div class="fm-card fm-card-pad" style="margin-top:12px;display:grid;gap:7px"><button class="fm-btn light" onclick="show('overview')">📊 Visão geral</button><button class="fm-btn light" onclick="show('profile')">⚙️ Meus dados</button><button class="fm-btn light" onclick="location.href='carrinho.html'">🛒 Meu carrinho</button><button class="fm-btn light" onclick="location.href='produtos.html'">🛍️ Continuar comprando</button></div></aside><section id="overview" class="fm-card fm-card-pad"><div class="fm-section-head"><div><h2>Olá, '+user+'! 👋</h2><p>Aqui está um resumo da sua conta.</p></div></div><div class="fm-grid" style="grid-template-columns:repeat(3,1fr)"><div class="fm-card fm-stat"><small>Pedidos</small><strong>0</strong></div><div class="fm-card fm-stat"><small>Favoritos</small><strong>'+JSON.parse(localStorage.getItem('flashmarket_favorites')||'[]').length+'</strong></div><div class="fm-card fm-stat"><small>Itens no carrinho</small><strong>'+fmGetCart().reduce((s,x)=>s+x.qty,0)+'</strong></div></div><div style="margin-top:22px" class="fm-alert">🔒 Seus dados de acesso ficam armazenados apenas neste navegador nesta versão demonstrativa.</div><div style="margin-top:20px"><h3 style="margin-bottom:8px">Pedidos recentes</h3><div style="padding:28px;text-align:center;background:#f7f7f8;border-radius:12px;color:#777;font-size:12px">Você ainda não possui pedidos.</div></div></section><section id="profile" class="fm-card fm-card-pad" style="display:none"><div class="fm-section-head"><div><h2>Meus dados</h2><p>Atualize suas informações pessoais.</p></div></div><form id="profileForm" class="fm-form"><div><label>Nome completo</label><input id="pname" class="fm-input" value="'+(profile.name||user)+'"></div><div><label>E-mail</label><input class="fm-input" value="'+(profile.email||'')+'" disabled></div><button class="fm-btn orange">SALVAR ALTERAÇÕES</button></form></section></div>'}function show(id){document.querySelector('#overview').style.display=id==='overview'?'block':'none';document.querySelector('#profile').style.display=id==='profile'?'block':'none'}function logout(){localStorage.removeItem('flashmarket_user');localStorage.removeItem('flashmarket_user_profile');location.href='index.html'}document.addEventListener('submit',e=>{if(e.target.id!=='profileForm')return;e.preventDefault();const p=JSON.parse(localStorage.getItem('flashmarket_user_profile')||'{}');p.name=document.querySelector('#pname').value.trim();localStorage.setItem('flashmarket_user_profile',JSON.stringify(p));localStorage.setItem('flashmarket_user',p.name);fmToast('Dados atualizados com sucesso')});</script></body></html>
