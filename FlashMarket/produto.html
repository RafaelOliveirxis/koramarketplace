<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Detalhes do produto FlashMarket"><meta name="theme-color" content="#ff3b1f"><title>FlashMarket | Produto</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/commerce-flow.css"><link rel="stylesheet" href="css/flow-unified.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container flow-main"><div class="flow-breadcrumb"><a href="index.html">Início</a> / <a href="produtos.html">Produtos</a> / <span id="crumb">Produto</span></div><div id="product"></div></main><footer class="fm-footer"><div class="fm-container fm-footer-grid"><div><h3>FlashMarket</h3><p>Produtos selecionados, ofertas e uma experiência simples de compra.</p></div><div><h3>Atendimento</h3><a href="suporte.html">Central de suporte</a><br><a href="rastrear-pedido.html">Rastrear pedido</a></div><div><h3>Conta</h3><a href="minha-conta.html">Minha conta</a><br><a href="carrinho.html">Carrinho</a></div></div></footer><script src="js/interno.js?v=20261001-2"></script><script src="js/catalog-bridge.js?v=20261001-2"></script><script>(function(){const id=Number(new URLSearchParams(location.search).get('id')||1),p=FM_PRODUCTS.find(x=>x.id===id)||FM_PRODUCTS[0],el=document.querySelector('#product');document.querySelector('#crumb').textContent=p.n;document.title='FlashMarket | '+p.n;el.innerHTML=`<div class="flow-layout"><section><div class="flow-card pad"><div class="flow-product-media"><img src="${p.i}" alt="${p.n}"></div></div><div class="flow-card pad flow-section"><h2>Sobre o produto</h2><p class="flow-muted">Produto selecionado pela FlashMarket para oferecer praticidade, qualidade e ótimo custo-benefício.</p><div class="flow-tags"><span>Compra segura</span><span>Produto em oferta</span><span>Envio para todo Brasil</span></div></div></section><aside><div class="flow-card pad"><span class="fm-product-cat">${p.c}</span><h1 class="flow-title">${p.n}</h1><div class="fm-rating" style="margin-top:10px">★★★★★ <span style="color:#777">4,8 · avaliações</span></div><div><span class="flow-price">${fmMoney(p.p)}</span><span class="flow-old">${fmMoney(p.o)}</span></div><p class="flow-muted">ou em até 3x sem juros</p><div class="flow-section"><strong>Quantidade</strong><div style="margin-top:8px"><span class="qty"><button id="minus" type="button">−</button><b id="qty">1</b><button id="plus" type="button">+</button></span></div></div><div class="flow-actions"><button class="fm-btn orange" id="buy" type="button">COMPRAR AGORA</button><button class="fm-btn light" id="add" type="button">ADICIONAR AO CARRINHO</button></div><div class="flow-trust"><div>🔒 Compra protegida</div><div>🚚 Envio para todo o Brasil</div><div>↩️ Atendimento pós-venda</div></div></div></aside></div><section class="flow-card pad flow-section"><h2>Informações</h2><p class="flow-muted">Categoria: ${p.c}. O preço promocional e a disponibilidade podem variar conforme o estoque e as condições da loja.</p></section>`;let q=1;const qel=document.querySelector('#qty');document.querySelector('#minus').onclick=()=>{q=Math.max(1,q-1);qel.textContent=q};document.querySelector('#plus').onclick=()=>{q=Math.min(50,q+1);qel.textContent=q};document.querySelector('#add').onclick=()=>{fmAdd(p.id,q);fmToast('Produto adicionado ao carrinho.')};document.querySelector('#buy').onclick=()=>{fmAdd(p.id,q);location.href='carrinho.html'};})();</script></body></html>
