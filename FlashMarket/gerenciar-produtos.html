<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRUD de produtos do KoraMarketplace">
  <title>Gerenciar Produtos | KoraMarketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body{background:#f6f7f9;font-family:Inter,Arial,sans-serif}
    .topbar{background:#ff321f;color:#fff}
    .brand{font-weight:900;letter-spacing:-.5px}
    .card{border:0;border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.07)}
    .btn-brand{background:#ff321f;color:#fff;border:0}.btn-brand:hover{background:#d92516;color:#fff}
    .product-img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#eee}
    .table td,.table th{vertical-align:middle}
    @media(max-width:767px){.table-responsive{font-size:13px}.actions-mobile{display:grid;gap:6px}.page-title{font-size:24px}}
  </style>
</head>
<body>
<header class="topbar py-3">
  <div class="container d-flex justify-content-between align-items-center gap-3">
    <div class="brand"><i class="bi bi-shop"></i> KoraMarketplace</div>
    <a href="index.html" class="btn btn-light btn-sm"><i class="bi bi-house"></i> Voltar à loja</a>
  </div>
</header>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <div>
      <h1 class="page-title h2 fw-bold mb-1">Gerenciamento de Produtos</h1>
      <p class="text-secondary mb-0">CRUD completo: cadastro, consulta, alteração e exclusão.</p>
    </div>
    <button class="btn btn-brand" id="novoProduto"><i class="bi bi-plus-lg"></i> Novo produto</button>
  </div>

  <div class="card p-3 p-md-4 mb-4">
    <form id="produtoForm" class="row g-3">
      <input type="hidden" id="produtoId">
      <div class="col-12 col-md-5">
        <label class="form-label fw-semibold">Nome do produto</label>
        <input id="nome" class="form-control" required maxlength="80">
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label fw-semibold">Categoria</label>
        <select id="categoria" class="form-select" required>
          <option value="">Selecione</option><option>Eletrônicos</option><option>Casa</option><option>Moda</option><option>Beleza</option><option>Esportes</option><option>Pet Shop</option><option>Livros</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label fw-semibold">Preço (R$)</label>
        <input id="preco" class="form-control" type="number" min="0" step="0.01" required>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label fw-semibold">Estoque</label>
        <input id="estoque" class="form-control" type="number" min="0" step="1" required>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">URL da imagem</label>
        <input id="imagem" class="form-control" type="url" placeholder="https://...">
      </div>
      <div class="col-12 d-flex flex-wrap gap-2">
        <button class="btn btn-brand" type="submit"><i class="bi bi-check-lg"></i> <span id="submitText">Cadastrar produto</span></button>
        <button class="btn btn-outline-secondary" type="button" id="cancelar">Limpar</button>
      </div>
    </form>
  </div>

  <div class="card p-3 p-md-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 fw-bold mb-0"><i class="bi bi-box-seam"></i> Produtos cadastrados</h2>
      <span class="badge text-bg-dark" id="contador">0 produtos</span>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>Imagem</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="lista"></tbody>
      </table>
    </div>
    <div id="vazio" class="text-center text-secondary py-5 d-none">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>
      Nenhum produto cadastrado.
    </div>
  </div>
</main>

<script>
const KEY='kora_crud_produtos_v1';
const form=document.getElementById('produtoForm');
const lista=document.getElementById('lista');
const vazio=document.getElementById('vazio');
const contador=document.getElementById('contador');
const submitText=document.getElementById('submitText');
const getProdutos=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const saveProdutos=p=>localStorage.setItem(KEY,JSON.stringify(p));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){
  const produtos=getProdutos();
  contador.textContent=produtos.length+' '+(produtos.length===1?'produto':'produtos');
  vazio.classList.toggle('d-none',produtos.length>0);
  lista.innerHTML=produtos.map(p=>`
    <tr>
      <td><img class="product-img" src="${esc(p.imagem||'https://via.placeholder.com/80?text=Produto')}" alt="${esc(p.nome)}" onerror="this.src='https://via.placeholder.com/80?text=Produto'"></td>
      <td class="fw-semibold">${esc(p.nome)}</td><td>${esc(p.categoria)}</td>
      <td>R$ ${Number(p.preco).toFixed(2).replace('.',',')}</td><td>${p.estoque}</td>
      <td class="text-end">
        <button class="btn btn-sm btn-outline-primary me-1" onclick="editar('${p.id}')"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" onclick="excluir('${p.id}')"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`).join('');
}
form.addEventListener('submit',e=>{
  e.preventDefault();
  const produtos=getProdutos(), id=document.getElementById('produtoId').value;
  const item={id:id||crypto.randomUUID(),nome:document.getElementById('nome').value.trim(),categoria:document.getElementById('categoria').value,preco:Number(document.getElementById('preco').value),estoque:Number(document.getElementById('estoque').value),imagem:document.getElementById('imagem').value.trim()};
  if(id){const i=produtos.findIndex(p=>p.id===id);if(i>=0)produtos[i]=item}else produtos.push(item);
  saveProdutos(produtos);limpar();render();
});
function editar(id){
  const p=getProdutos().find(x=>x.id===id);if(!p)return;
  document.getElementById('produtoId').value=p.id;document.getElementById('nome').value=p.nome;
  document.getElementById('categoria').value=p.categoria;document.getElementById('preco').value=p.preco;
  document.getElementById('estoque').value=p.estoque;document.getElementById('imagem').value=p.imagem||'';
  submitText.textContent='Salvar alteração';window.scrollTo({top:0,behavior:'smooth'});
}
function excluir(id){
  const p=getProdutos().find(x=>x.id===id);
  if(p && confirm('Excluir o produto "'+p.nome+'"?')){saveProdutos(getProdutos().filter(x=>x.id!==id));render();}
}
function limpar(){form.reset();document.getElementById('produtoId').value='';submitText.textContent='Cadastrar produto'}
document.getElementById('cancelar').onclick=limpar;
document.getElementById('novoProduto').onclick=()=>{limpar();document.getElementById('nome').focus();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
