<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMarket | Suporte</title><link rel="stylesheet" href="css/interno.css"><style>body{background:#f4f6f8}.wrap{max-width:1100px;margin:auto;padding:28px 16px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-top:14px}.ticket{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px}.meta{font-size:9px;color:#777}.badge{float:right;padding:5px 8px;border-radius:99px;background:#fff4d6;font-size:8px;font-weight:800}.msg{padding:9px;border-radius:9px;background:#f7f8f9;margin-top:7px;font-size:10px}.msg.admin{background:#fff1e9}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#151619;color:#fff}@media(max-width:700px){.head{flex-direction:column;align-items:flex-start}}</style></head><body><div data-fm-header></div><main class="wrap"><div class="head"><div><h1>Central de suporte</h1><p style="font-size:10px;color:#777">Chamados reais vinculados aos pedidos.</p></div><a class="btn" href="admin-expedicao.html">Expedição</a></div><div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="setFilter('all')">Todos</button><button class="btn" onclick="setFilter('open')">Abertos</button><button class="btn" onclick="setFilter('in_progress')">Em atendimento</button><button class="btn" onclick="setFilter('waiting_customer')">Aguardando</button><button class="btn" onclick="setFilter('resolved')">Resolvidos</button></div><div id="stats" style="margin-top:10px;font-size:10px;color:#777"></div></div><div id="app" class="card">Carregando chamados…</div></main><script src="js/interno.js?v=20261001-1"></script><script src="js/auth-real.js?v=20261001-1"></script><script>let allTickets=[],currentFilter='all';function setFilter(f){currentFilter=f;renderTickets()}function renderTickets(){const app=document.querySelector('#app');const tickets=currentFilter==='all'?allTickets:allTickets.filter(t=>t.status===currentFilter);document.querySelector('#stats').textContent='Total: '+allTickets.length+' · Exibindo: '+tickets.length;app.innerHTML=tickets.map(t=>const app=document.querySelector('#app');try{const d=await KoraAuth.request('/api/auth/me?include=admin-support');if(!d.isAdmin)throw Error('Acesso administrativo não autorizado.');allTickets=d.tickets||[];renderTickets();return;||'<p>Nenhum chamado encontrado.</p>'}catch(e){app.innerHTML='<p>'+esc(e.message||'Não foi possível carregar.')+'</p>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function updateTicket(e,id){e.preventDefault();try{await KoraAuth.request('/api/auth/me',{method:'POST',body:JSON.stringify({action:'admin_support_update',ticketId:id,status:document.querySelector('#status-'+id).value,message:document.querySelector('#msg-'+id).value.trim()})});alert('Chamado atualizado.');load()}catch(x){alert(x.message||'Não foi possível atualizar.')}}load()</script></body></html>
