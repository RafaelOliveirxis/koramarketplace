<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMarket | Suporte</title><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#151619}.wrap{max-width:1100px;margin:auto;padding:28px 16px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-top:14px}.ticket{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px}.meta{font-size:11px;color:#777;margin-top:5px}.badge{float:right;padding:5px 8px;border-radius:99px;background:#fff4d6;font-size:11px;font-weight:800}.msg{padding:10px;border-radius:9px;background:#f7f8f9;margin-top:7px;font-size:13px}.msg.admin{background:#fff1e9}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#151619;color:#fff;text-decoration:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters .btn{font-size:12px}@media(max-width:700px){.head{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="head"><div><h1>Central de suporte</h1><p class="meta">Pós-venda e atendimento vinculados aos pedidos.</p></div><a class="btn" href="admin-expedicao.html">Expedição</a></div><div class="card"><div class="filters"><button class="btn" onclick="setFilter('all')">Todos</button><button class="btn" onclick="setFilter('open')">Abertos</button><button class="btn" onclick="setFilter('in_progress')">Em atendimento</button><button class="btn" onclick="setFilter('waiting_customer')">Aguardando</button><button class="btn" onclick="setFilter('resolved')">Resolvidos</button></div><div id="stats" class="meta"></div></div><div id="app" class="card">Carregando chamados…</div></main><script src="js/auth-real.js?v=20261003"></script><script>let allTickets=[],currentFilter='all';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function setFilter(f){currentFilter=f;renderTickets()}function renderTickets(){const app=document.querySelector('#app'),tickets=currentFilter==='all'?allTickets:allTickets.filter(t=>t.status===currentFilter);document.querySelector('#stats').textContent='Total: '+allTickets.length+' · Exibindo: '+tickets.length;app.innerHTML=tickets.map(t=>'<article class="ticket"><span class="badge">'+esc(t.status)+'</span><b>'+esc(t.id)+' · '+esc(t.subject)+'</b><div class="meta">Pedido #'+esc(t.orderId)+' · '+esc(t.customerName)+' · '+esc(t.customerEmail)+'</div>'+(t.messages||[]).map(m=>'<div class="msg '+(m.author==='admin'?'admin':'')+'"><b>'+esc(m.author==='admin'?'Atendimento':'Cliente')+':</b> '+esc(m.message)+'<div class="meta">'+new Date(m.date).toLocaleString('pt-BR')+'</div></div>').join('')+'<form onsubmit="updateTicket(event,\''+esc(t.id)+'\')" style="margin-top:10px"><select id="status-'+esc(t.id)+'" style="padding:8px;border:1px solid #ddd;border-radius:8px"><option value="open" '+(t.status==='open'?'selected':'')+'>Aberto</option><option value="in_progress" '+(t.status==='in_progress'?'selected':'')+'>Em atendimento</option><option value="waiting_customer" '+(t.status==='waiting_customer'?'selected':'')+'>Aguardando cliente</option><option value="resolved" '+(t.status==='resolved'?'selected':'')+'>Resolvido</option><option value="closed" '+(t.status==='closed'?'selected':'')+'>Fechado</option></select><textarea id="msg-'+esc(t.id)+'" maxlength="4000" placeholder="Responder ao cliente (opcional)" style="width:100%;min-height:65px;margin:7px 0;border:1px solid #ddd;border-radius:8px;padding:8px;box-sizing:border-box"></textarea><button class="btn" type="submit">Atualizar chamado</button></form></article>').join('')||'<p>Nenhum chamado encontrado.</p>'}async function load(){const app=document.querySelector('#app');try{const d=await KoraAuth.request('/api/auth/me?include=admin-support');if(!d.isAdmin)throw Error('Acesso administrativo não autorizado.');allTickets=d.tickets||[];renderTickets()}catch(e){app.innerHTML='<p>'+esc(e.message||'Não foi possível carregar.')+'</p>'}}async function updateTicket(e,id){e.preventDefault();try{await KoraAuth.request('/api/auth/me',{method:'POST',body:JSON.stringify({action:'admin_support_update',ticketId:id,status:document.querySelector('#status-'+id).value,message:document.querySelector('#msg-'+id).value.trim()})});alert('Chamado atualizado.');await load()}catch(x){alert(x.message||'Não foi possível atualizar.')}}load()</script></body></html>
