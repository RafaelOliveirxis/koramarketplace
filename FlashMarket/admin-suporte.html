<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashMarket | Suporte</title><link rel="stylesheet" href="css/interno.css"><style>body{background:#f4f6f8}.wrap{max-width:1100px;margin:auto;padding:28px 16px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-top:14px}.ticket{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px}.meta{font-size:9px;color:#777}.badge{float:right;padding:5px 8px;border-radius:99px;background:#fff4d6;font-size:8px;font-weight:800}.msg{padding:9px;border-radius:9px;background:#f7f8f9;margin-top:7px;font-size:10px}.msg.admin{background:#fff1e9}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer;background:#151619;color:#fff}@media(max-width:700px){.head{flex-direction:column;align-items:flex-start}}</style></head><body><div data-fm-header></div><main class="wrap"><div class="head"><div><h1>Central de suporte</h1><p style="font-size:10px;color:#777">Chamados reais vinculados aos pedidos.</p></div><a class="btn" href="admin-expedicao.html">Expedição</a></div><div id="app" class="card">Carregando chamados…</div></main><script src="js/interno.js?v=20261001-1"></script><script src="js/auth-real.js?v=20261001-1"></script><script>async function load(){const app=document.querySelector('#app');try{const d=await KoraAuth.request('/api/auth/me?include=admin-support');if(!d.isAdmin)throw Error('Acesso administrativo não autorizado.');app.innerHTML=(d.tickets||[]).map(t=>'<article class="ticket"><span class="badge">'+esc(t.status)+'</span><b>'+esc(t.id)+' · '+esc(t.subject)+'</b><div class="meta">Pedido #'+esc(t.orderId)+' · '+esc(t.customerName)+' · '+esc(t.customerEmail)+'</div>'+(t.messages||[]).map(m=>'<div class="msg '+(m.author==='admin'?'admin':'')+'"><b>'+esc(m.author==='admin'?'Atendimento':'Cliente')+':</b> '+esc(m.message)+'<div class="meta">'+new Date(m.date).toLocaleString('pt-BR')+'</div></div>').join('')+'<form onsubmit="updateTicket(event,\''+esc(t.id)+'\')" style="margin-top:10px"><select id="status-'+esc(t.id)+'" style="padding:8px;border:1px solid #ddd;border-radius:8px"><option '+(t.status==='open'?'selected':'')+' value="open">Aberto</option><option '+(t.status==='in_progress'?'selected':'')+' value="in_progress">Em atendimento</option><option '+(t.status==='waiting_customer'?'selected':'')+' value="waiting_customer">Aguardando cliente</option><option '+(t.status==='resolved'?'selected':'')+' value="resolved">Resolvido</option><option '+(t.status==='closed'?'selected':'')+' value="closed">Fechado</option></select><textarea id="msg-'+esc(t.id)+'" maxlength="4000" placeholder="Responder ao cliente (opcional)" style="width:100%;min-height:65px;margin:7px 0;border:1px solid #ddd;border-radius:8px;padding:8px;box-sizing:border-box"></textarea><button class="btn" type="submit">Atualizar chamado</button></form></article>').join('')||'<p>Nenhum chamado encontrado.</p>'}catch(e){app.innerHTML='<p>'+esc(e.message||'Não foi possível carregar.')+'</p>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function updateTicket(e,id){e.preventDefault();try{await KoraAuth.request('/api/auth/me',{method:'POST',body:JSON.stringify({action:'admin_support_update',ticketId:id,status:document.querySelector('#status-'+id).value,message:document.querySelector('#msg-'+id).value.trim()})});alert('Chamado atualizado.');load()}catch(x){alert(x.message||'Não foi possível atualizar.')}}load()</script></body></html>
