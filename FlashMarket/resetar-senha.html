<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ee4d2d">
  <meta name="description" content="Redefinição de senha FlashMarket">
  <title>FlashMarket | Redefinir senha</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/internal-polish.css?v=20261003-1">
  <style>
    .reset-page{min-height:100vh;display:grid;place-items:center;padding:30px 0;background:linear-gradient(180deg,#f6f7f8,#eceff2)}
    .reset-card{width:min(440px,100%);padding:30px;border-radius:18px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 16px 40px rgba(17,19,22,.08)}
    .reset-card h1{margin:10px 0 8px;font-size:30px}.reset-card p{color:#73767b;font-size:13px;line-height:1.5}.reset-card label{display:block;margin:18px 0 7px;font-size:11px;font-weight:800}.reset-card input{width:100%;min-height:46px;padding:0 12px;box-sizing:border-box;border:1px solid #d9dadd;border-radius:9px;font-size:14px;outline:0}.reset-card input:focus{border-color:#f5b700;box-shadow:0 0 0 3px rgba(245,183,0,.12)}.reset-card button{width:100%;margin-top:22px;min-height:46px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:900;cursor:pointer}#resetMessage{min-height:20px;margin-bottom:0}
  </style>
</head>
<body class="fm-page">
  <main class="reset-page">
    <section class="reset-card">
      <span class="fm-kicker">🔐 ÁREA SEGURA</span>
      <h1>Redefinir senha</h1>
      <p>Escolha uma nova senha para voltar à sua conta FlashMarket.</p>
      <form id="resetForm">
        <label for="newPassword">Nova senha</label>
        <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirmPassword">Confirmar nova senha</label>
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
        <button type="submit">SALVAR NOVA SENHA</button>
      </form>
      <p id="resetMessage"></p>
      <a class="fm-btn light full" style="margin-top:10px" href="login.html">Voltar para o login</a>
    </section>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('resetMessage');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (!token) { message.textContent = 'Link de recuperação ausente.'; return; }
      if (password !== confirmation) { message.textContent = 'As senhas não coincidem.'; return; }
      const button = form.querySelector('button');
      button.disabled = true; message.textContent = 'Salvando...';
      try {
        const apiBase = window.location.hostname.endsWith('github.io') ? 'https://koramarketplace.vercel.app' : '';
        const response = await fetch(`${apiBase}/api/auth/reset-password`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Não foi possível redefinir a senha.');
        form.reset(); message.textContent = 'Senha redefinida. Você já pode entrar na sua conta.';
      } catch (error) { message.textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
