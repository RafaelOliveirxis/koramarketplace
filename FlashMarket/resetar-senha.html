<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff321f"><title>FlashMarket | Recuperar senha</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"><link rel="stylesheet" href="css/internal-polish.css"><style>.reset-page{min-height:100vh;display:grid;place-items:center;padding:30px 16px;background:linear-gradient(180deg,#f7f7f7,#eceff2)}.reset-card{width:min(440px,100%);padding:30px;border-radius:18px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 16px 40px rgba(17,19,22,.08)}.reset-card h1{margin:10px 0 8px;font-size:30px}.reset-card p{color:#73767b;font-size:13px;line-height:1.5}.reset-card label{display:block;margin:18px 0 7px;font-size:11px;font-weight:800}.reset-card input{width:100%;min-height:46px;padding:0 12px;box-sizing:border-box;border:1px solid #d9dadd;border-radius:9px;font-size:14px;outline:0}.reset-card input:focus{border-color:#ff321f;box-shadow:0 0 0 3px rgba(255,50,31,.1)}.reset-card button{width:100%;margin-top:22px;min-height:46px;border:0;border-radius:8px;background:#ff321f;color:#fff;font-weight:900;cursor:pointer}.reset-card button:disabled{opacity:.6}.message{min-height:20px;margin:14px 0 0!important;font-weight:700}</style></head><body class="fm-page"><main class="reset-page"><section class="reset-card"><span class="fm-kicker">🔐 ÁREA SEGURA</span><h1>Recuperar senha</h1><p>Informe o e-mail da sua conta e defina uma nova senha. Esta versão funciona diretamente no site, sem depender de Vercel.</p><form id="resetForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"><label for="newPassword">Nova senha</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo de 8 caracteres"><label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repita a nova senha"><button type="submit">SALVAR NOVA SENHA</button></form><p id="resetMessage" class="message"></p><a class="fm-btn light full" style="margin-top:10px" href="login.html">Voltar para o login</a></section></main><script src="js/auth-real.js"></script><script>document.querySelector('#resetForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.querySelector('#email').value.trim(),password=document.querySelector('#newPassword').value,confirm=document.querySelector('#confirmPassword').value,msg=document.querySelector('#resetMessage'),btn=e.currentTarget.querySelector('button');if(password!==confirm){msg.textContent='As senhas não coincidem.';return}btn.disabled=true;msg.textContent='Atualizando senha...';try{await window.KoraAuth.request('/api/auth/reset-password',{method:'POST',body:JSON.stringify({email,password})});msg.textContent='Senha atualizada com sucesso. Você já pode entrar.';e.currentTarget.reset()}catch(err){msg.textContent=err.message||'Não foi possível atualizar a senha.'}finally{btn.disabled=false}});</script></body></html>
