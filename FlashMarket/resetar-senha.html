<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>FlashMarket | Redefinir senha</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; }
    .reset-card { width: min(420px, calc(100% - 32px)); padding: 32px; border-radius: 16px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
    .reset-card h1 { margin: 0 0 8px; font-size: 28px; }
    .reset-card p { color: #73767b; font: 500 13px/1.5 Inter, sans-serif; }
    .reset-card label { display: block; margin: 20px 0 7px; font: 700 11px Inter, sans-serif; }
    .reset-card input { width: 100%; min-height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid #d9dadd; border-radius: 8px; font: 500 14px Inter, sans-serif; }
    .reset-card button { width: 100%; margin-top: 22px; min-height: 44px; border: 0; border-radius: 8px; background: #ffc928; color: #111; font: 800 12px Inter, sans-serif; cursor: pointer; }
    #resetMessage { min-height: 20px; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Redefinir senha</h1>
    <p>Escolha uma nova senha para voltar à sua conta FlashMarket.</p>
    <form id="resetForm">
      <label for="newPassword">Nova senha</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirmPassword">Confirmar nova senha</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button type="submit">SALVAR NOVA SENHA</button>
    </form>
    <p id="resetMessage"></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('resetForm');
    const message = document.getElementById('resetMessage');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (!token) { message.textContent = 'Link de recuperação ausente.'; return; }
      if (password !== confirmation) { message.textContent = 'As senhas não coincidem.'; return; }
      const button = form.querySelector('button');
      button.disabled = true;
      message.textContent = 'Salvando...';
      try {
        const apiBase = window.location.hostname.endsWith('github.io')
          ? 'https://koramarketplace.vercel.app'
          : '';
        const response = await fetch(`${apiBase}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Não foi possível redefinir a senha.');
        form.reset();
        message.textContent = 'Senha redefinida. Você já pode entrar na sua conta.';
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
