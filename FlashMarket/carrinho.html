<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Carrinho de compras FlashMarket"><title>FlashMarket | Carrinho</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container fm-section"><div class="fm-hero"><span class="fm-kicker">🛒 SEU PEDIDO</span><h1 class="fm-title">Carrinho de compras</h1><p class="fm-subtitle">Revise seus produtos, ajuste quantidades e finalize sua compra com segurança.</p></div><div id="cart"></div></main><footer class="fm-footer"><div class="fm-container fm-footer-grid"><div><h3>FlashMarket</h3><p>Produtos selecionados, ofertas e uma experiência simples de compra.</p></div><div><h3>Atendimento</h3><a href="suporte.html">Central de suporte</a><br><a href="rastrear-pedido.html">Rastrear pedido</a></div><div><h3>Conta</h3><a href="minha-conta.html">Minha conta</a><br><a href="login.html">Entrar / cadastrar</a></div></div></footer><script src="js/interno.js"></script><script>function render(){const el=document.querySelector('#cart'),c=fmGetCart(),items=c.map(x=>({...x,p:FM_PRODUCTS.find(p=>p.id===x.id)})).filter(x=>x.p);if(!items.length){el.innerHTML='<div class="fm-card fm-empty"><div class="icon">🛍️</div><h2>Seu carrinho está vazio</h2><p>Encontre produtos e ofertas para começar sua compra.</p><br><a class="fm-btn orange" href="produtos.html">Explorar produtos</a></div>';return}let total=items.reduce((s,x)=>s+x.p.p*x.qty,0);el.innerHTML='<div class="fm-card fm-card-pad"><div class="fm-section-head"><div><h2>Itens selecionados</h2><p>'+items.length+' produto(s) no carrinho</p></div><a class="fm-btn light" href="produtos.html">Continuar comprando</a></div><div>'+items.map(x=>'<div style="display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--fm-line)"><img src="'+x.p.i+'" alt="'+x.p.n+'" style="width:90px;height:90px;object-fit:cover;border-radius:12px;background:#f1f2f4"><div><strong>'+x.p.n+'</strong><div style="color:#777;font-size:11px;margin:5px 0">'+x.p.c+'</div><button class="fm-btn light" onclick="fmChange('+x.id+',-1)">−</button> <b>'+x.qty+'</b> <button class="fm-btn light" onclick="fmChange('+x.id+',1)">+</button></div><div style="text-align:right"><strong>'+fmMoney(x.p.p*x.qty)+'</strong><br><button class="fm-btn light" onclick="fmRemove('+x.id+')">Remover</button></div></div>').join('')+'</div><div style="display:flex;justify-content:flex-end;margin-top:22px"><div style="width:min(100%,360px)"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Subtotal</span><strong>'+fmMoney(total)+'</strong></div><div class="fm-alert">🚚 Frete e prazo serão calculados na finalização.</div><br><a class="fm-btn orange full" style="display:flex;align-items:center;justify-content:center;box-sizing:border-box" href="checkout.html">IR PARA CHECKOUT →</a></div></div></div>')}render();fmUpdateCount();</script></body></html>
