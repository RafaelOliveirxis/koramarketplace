<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Entrar ou criar conta FlashMarket"><title>FlashMarket | Entrar</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/interno.css"></head><body class="fm-page"><div data-fm-header></div><main class="fm-container" style="padding:55px 0"><div style="max-width:520px;margin:auto"><div class="fm-card fm-card-pad"><div style="text-align:center;margin-bottom:24px"><span class="fm-kicker">🔐 ÁREA SEGURA</span><h1 style="font-size:32px;margin:12px 0 7px">Sua conta FlashMarket</h1><p style="color:var(--fm-muted);font-size:12px">Entre para acompanhar pedidos, salvar favoritos e finalizar suas compras.</p></div><div id="msg"></div><form id="loginForm" class="fm-form"><div><label>E-mail</label><input id="email" class="fm-input" type="email" required placeholder="voce@email.com"></div><div><label>Senha</label><input id="pass" class="fm-input" type="password" minlength="6" required placeholder="Mínimo de 6 caracteres"></div><label class="fm-check"><input type="checkbox" id="remember" checked> Manter minha sessão neste dispositivo</label><button class="fm-btn orange full">ENTRAR</button></form><div style="text-align:center;margin:20px 0;color:#999;font-size:11px">ou</div><button id="toggle" class="fm-btn light full">CRIAR NOVA CONTA</button><div id="signup" style="display:none;margin-top:20px"><form id="signupForm" class="fm-form"><div><label>Nome completo</label><input id="name" class="fm-input" required placeholder="Seu nome"></div><div><label>E-mail</label><input id="email2" class="fm-input" type="email" required placeholder="voce@email.com"></div><div><label>Senha</label><input id="pass2" class="fm-input" type="password" minlength="6" required placeholder="Crie uma senha"></div><button class="fm-btn orange full">CRIAR CONTA</button></form></div><p style="text-align:center;margin:18px 0 0;color:#888;font-size:10px">Ao continuar, você concorda com os termos e a política de privacidade.</p></div><p style="text-align:center;margin-top:16px;font-size:11px"><a href="index.html">← Voltar para a loja</a></p></div></main><script src="js/interno.js"></script><script>const signup=document.querySelector('#signup'),toggle=document.querySelector('#toggle'),msg=document.querySelector('#msg');toggle.onclick=()=>{signup.style.display=signup.style.display==='none'?'block':'none';toggle.textContent=signup.style.display==='none'?'CRIAR NOVA CONTA':'VOLTAR PARA LOGIN'};function users(){try{return JSON.parse(localStorage.getItem('flashmarket_users')||'[]')}catch{return[]}}document.querySelector('#loginForm').onsubmit=e=>{e.preventDefault();const email=document.querySelector('#email').value.trim().toLowerCase(),pass=document.querySelector('#pass').value,u=users().find(x=>x.email===email&&x.password===pass);if(!u){msg.innerHTML='<div class="fm-alert">E-mail ou senha incorretos. Se ainda não possui conta, crie uma abaixo.</div><br>';return}localStorage.setItem('flashmarket_user',u.name||email);localStorage.setItem('flashmarket_user_profile',JSON.stringify(u));const r=new URLSearchParams(location.search).get('return')||'minha-conta.html';location.href=r};document.querySelector('#signupForm').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#name').value.trim(),email=document.querySelector('#email2').value.trim().toLowerCase(),password=document.querySelector('#pass2').value;if(users().some(x=>x.email===email)){msg.innerHTML='<div class="fm-alert">Este e-mail já está cadastrado.</div><br>';return}const u={name,email,password};const a=users();a.push(u);localStorage.setItem('flashmarket_users',JSON.stringify(a));localStorage.setItem('flashmarket_user',name);localStorage.setItem('flashmarket_user_profile',JSON.stringify(u));location.href=new URLSearchParams(location.search).get('return')||'minha-conta.html'};</script></body></html>
