name: Android build (FlashMarket)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FlashMarket/**"
      - "scripts/configure-mobile.mjs"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Node dependencies
        run: npm install

      - name: Validate web app files
        run: npm run web:check

      - name: Generate Android project and sync Capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npm run mobile:configure
          npm run mobile:assets
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
