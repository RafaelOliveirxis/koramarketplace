name: 🚀 FlashMarket Store Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release label
        required: false
        default: FlashMarket 1.2.0
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  android-release:
    name: Android signed AAB
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure mobile project
        run: npm run mobile:configure

      - name: Generate native icons and splash
        run: npm run mobile:assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/flashmarket-upload.jks

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=flashmarket-upload.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          if 'signingConfigs {' not in s:
              s = s.replace(
                  'android {',
                  '''android {\n    signingConfigs {\n        release {\n            def keystorePropertiesFile = rootProject.file("keystore.properties")\n            def keystoreProperties = new Properties()\n            if (keystorePropertiesFile.exists()) {\n                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n            }\n            storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null\n            storePassword keystoreProperties['storePassword']\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n        }\n    }''',
                  1,
              )
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace(
                  'buildTypes {\n        release {',
                  'buildTypes {\n        release {\n            signingConfig signingConfigs.release',
                  1,
              )
          p.write_text(s)
          PY

      - name: Build signed Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify AAB exists
        run: test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-android-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Cleanup Android signing files
        if: always()
        run: rm -f android/flashmarket-upload.jks android/keystore.properties

  ios-release:
    name: iOS Archive and IPA
    runs-on: macos-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Configure mobile project
        run: npm run mobile:configure

      - name: Generate native icons and splash
        run: npm run mobile:assets

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security list-keychains -d user -s build.keychain-db login.keychain-db

      - name: Import Apple distribution certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > distribution.p12
          security import distribution.p12 -k build.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain-db

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/flashmarket.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/flashmarket.mobileprovision" > profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' profile.plist)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive iOS app
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/FlashMarket.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROVISIONING_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="br.flashmarket.app" \
            MARKETING_VERSION="1.2.0" \
            CURRENT_PROJECT_VERSION="12000"

      - name: Create App Store export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          team = os.environ['APPLE_TEAM_ID']
          profile = os.environ['APPLE_PROVISIONING_PROFILE_NAME']
          Path('ExportOptions.plist').write_text(f'''<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict>\n<key>method</key><string>app-store</string>\n<key>signingStyle</key><string>manual</string>\n<key>teamID</key><string>{team}</string>\n<key>provisioningProfiles</key><dict>\n<key>br.flashmarket.app</key><string>{profile}</string>\n</dict>\n<key>stripSwiftSymbols</key><true/>\n<key>compileBitcode</key><false/>\n</dict></plist>\n''')
          PY

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/FlashMarket.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/ios-export" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ExportOptions.plist"

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-ios-archive-${{ github.ref_name }}
          path: FlashMarket.xcarchive
          if-no-files-found: error

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-ios-ipa-${{ github.ref_name }}
          path: ios-export/*.ipa
          if-no-files-found: error

      - name: Cleanup Apple signing material
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f distribution.p12 profile.plist ExportOptions.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/flashmarket.mobileprovision"
