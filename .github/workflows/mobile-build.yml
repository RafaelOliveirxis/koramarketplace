name: 📱 FlashMarket Mobile Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android
        run: npm run mobile:configure

      - name: Generate icons and splash
        run: npm run mobile:assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Android release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: flashmarket-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    name: iOS validation build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Configure iOS
        run: npm run mobile:configure

      - name: Generate icons and splash
        run: npm run mobile:assets

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Build iOS simulator app
        working-directory: ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
